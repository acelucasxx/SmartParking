name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: server · build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # build 包含 spotlessCheck、编译（-Xlint:all）与单元测试
      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: |
            server/*/build/reports/tests/
            tools/dtu-sim/build/reports/tests/
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: smartparking-server
          path: server/app/build/libs/smartparking-server.jar
          retention-days: 14

  admin-web:
    name: admin-web · lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npx eslint .
      - name: Format check
        run: npx prettier --check src
      # build = vue-tsc 类型检查 + vite 构建
      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: admin-web/dist
          retention-days: 14

  miniapp:
    name: miniapp · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck

  compose:
    name: deploy · compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate local compose file
        run: docker compose -f deploy/local/docker-compose.yml config -q

  api:
    name: api · lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: docs/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 错误码三处一致性由 server 的 ErrorCodeContractTest 校验
      - name: Lint OpenAPI contracts
        run: npx -y @redocly/cli@1.34.5 lint --format=github-actions
