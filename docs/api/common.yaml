    PageMeta:
      type: object
      required: [total, page, size]
      properties:
        total:
          type: integer
          example: 42
        page:
          type: integer
          description: 从 1 开始
          example: 1
        size:
          type: integer
          example: 20

    Id:
      type: integer
      format: int64
      minimum: 1
      example: 1001

    DateTime:
      type: string
      format: date-time
      description: ISO 8601，带时区偏移，统一东八区。
      example: '2026-12-31T18:00:00+08:00'

    Sn:
      type: string
      pattern: '^[A-Z0-9]{8,32}$'
      example: SP2612000123

    PhoneMasked:
      type: string
      description: 脱敏手机号，只显示前 3 位与后 4 位
      example: 138****5678

    RawFrame:
      type: string
      description: RS485 原始帧，十六进制大写，字节间空格分隔
      example: FD 00 01 09 16 11 FD FA

    BindStatus:
      type: string
      enum: [PENDING, BOUND]
      description: PENDING 待激活 / BOUND 已绑定

    GateStatus:
      type: string
      enum: [OPENED, CLOSED, OPENING, CLOSING, STOPPED, FAULT, UNKNOWN]
      description: OPENED 已抬杆（放行）/ CLOSED 已落杆（占位）/ OPENING、CLOSING 动作中 / STOPPED 动作被打断 / FAULT 电机故障 / UNKNOWN 未知
      example: CLOSED

    OnlineState:
      type: string
      enum: [ONLINE, SLEEP, OFFLINE]
      description: 判定规则见 PRD 8.5
      example: ONLINE

    GateAction:
      type: string
      enum: [OPEN, CLOSE]
      description: OPEN 抬杆 / CLOSE 落杆

    Channel:
      type: string
      enum: [REMOTE, BLE]
      description: REMOTE 远程 / BLE 蓝牙

    CommandStatus:
      type: string
      enum: [PENDING, SENT, EXECUTING, SUCCESS, FAILED, TIMEOUT]
      description: PENDING、SENT、EXECUTING 为未终结；只有到位才算 SUCCESS
      example: EXECUTING

    CommandResultCode:
      type: string
      enum: [ALREADY_IN_TARGET, MOTOR_FAULT, OBSTRUCTED, INFRARED, INTERRUPTED, TIMEOUT]
      description: |
        ALREADY_IN_TARGET 已在目标状态未下发（视为成功）/ MOTOR_FAULT 电机故障 / OBSTRUCTED 遇阻 /
        INFRARED 红外防砸 / INTERRUPTED 中间停止 / TIMEOUT 15 秒未到位

    TriggerSource:
      type: string
      enum: [APP, REMOTE_CONTROL, GROUND_SENSOR, EXTERNAL_SWITCH, AUTO_CLOSE, OBSTRUCTED, INFRARED, POWER_ON, UNKNOWN]
      description: |
        动作的触发方式，由状态帧原因码映射（PRD 8.3）：APP 平台指令（16）/ REMOTE_CONTROL 遥控器（01/02）/
        GROUND_SENSOR 地感雷达（03/04）/ EXTERNAL_SWITCH 外部开关（06/07）/ AUTO_CLOSE 延时自动关（10）/
        OBSTRUCTED 遇阻（11）/ INFRARED 红外防砸（12）/ POWER_ON 上电找零（15）

    MemberRole:
      type: string
      enum: [OWNER, MEMBER]
      description: 当前用户在该设备上的角色

    MemberStatus:
      type: string
      enum: [ACTIVE, REVOKED, EXPIRED, QUIT]

    Period:
      type: object
      description: |
        授权有效期。PERMANENT 永久；RELATIVE 从接受邀请（或修改）时起算 durationDays 天；CUSTOM 自定义起止，精确到分钟，止须晚于当前时间。
      required: [type]
      properties:
        type:
          type: string
          enum: [PERMANENT, RELATIVE, CUSTOM]
          example: RELATIVE
        durationDays:
          type: integer
          enum: [1, 7, 30]
          description: type = RELATIVE 时必填
          example: 7
        validFrom:
          $ref: '#/components/schemas/DateTime'
        validTo:
          $ref: '#/components/schemas/DateTime'

    MessageType:
      type: string
      enum: [GRANT, REVOKE, EXPIRE, TRANSFER, UNBIND, FAULT, SYSTEM]

    AlarmType:
      type: string
      enum: [MOTOR_FAULT, OBSTRUCTED, INFRARED, CMD_TIMEOUT, OFFLINE_24H]

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'

  responses:
    Ok:
      description: 成功，无返回数据
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Error:
      description: |
        业务或参数错误。HTTP 状态码与错误码对应关系见错误码表；具体接口可能返回的错误码列在该接口的 x-error-codes 中，
        另外任何需要登录的接口都可能返回 10002 / 10010。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            code: 10001
            message: 请求参数不合法
