# 小程序与后台共用的组件：响应信封、错误码、分页、枚举。
# 只被 openapi-app.yaml / openapi-admin.yaml 通过 $ref 引用，本身不是独立的 OpenAPI 文档。
components:
  schemas:
    Envelope:
      type: object
      description: 统一响应信封。`code` 为 0 表示成功；非 0 时 `data` 缺省，取值见 ErrorCode。
      required: [code, message]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: 成功

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 可直接展示给用户的提示；同一错误码在具体场景下可能带补充信息，如剩余尝试次数。
          example: 激活码错误，还可尝试 3 次

