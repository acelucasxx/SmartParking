## 本地开发用 EMQX 配置，挂载为 /opt/emqx/etc/emqx.conf。生产配置另行维护，密钥不得沿用这里的值。
## 节点名、控制台密码等仍由 docker-compose.yml 中的环境变量覆盖。

node {
  name = "emqx@127.0.0.1"
  cookie = "emqx_cookie_dev_only"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 18083
}

## 一机一密（PRD 8.1）：每次连接回调业务服务校验，规则见 server/iot 的 EmqxAuthController。
## 业务服务未启动时回调失败，所有客户端都无法连接。
authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://host.docker.internal:8080/internal/emqx/authn"
    headers {
      "content-type" = "application/json"
      "x-emqx-token" = "emqx_hook_dev_only"
    }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    request_timeout = 5s
  }
]

## 主题权限：设备只能发布自己的上行、订阅自己的下行；云端账号为超级用户，不受限制。
authorization {
  no_match = deny
  deny_action = ignore
  cache {
    enable = true
  }
  sources = [
    {
      type = file
      enable = true
      path = "etc/acl.conf"
    }
  ]
}

## 设备连接 / 断开事件（IOT-05）：规则引擎筛出 DTU 客户端，经 HTTP 动作推送到业务服务，写入 device_runtime.last_conn_event。
## 动作可能并发、乱序或重试，业务服务按事件时间戳只保留最新的一条。
connectors {
  http {
    smartparking {
      enable = true
      url = "http://host.docker.internal:8080"
      connect_timeout = 5s
      pool_size = 8
      ## 业务服务晚于 EMQX 启动时，最多 5 秒后恢复推送；期间的事件在缓冲区等待
      resource_opts {
        health_check_interval = 5s
      }
    }
  }
}

actions {
  http {
    device_conn_events {
      enable = true
      connector = smartparking
      parameters {
        method = post
        path = "/internal/emqx/events"
        headers {
          "content-type" = "application/json"
          "x-emqx-token" = "emqx_hook_dev_only"
        }
        max_retries = 3
      }
      resource_opts {
        request_ttl = 45s
        health_check_interval = 5s
      }
    }
  }
}

rule_engine {
  rules {
    device_conn_events {
      enable = true
      sql = """SELECT event, clientid, timestamp, reason FROM "$events/client_connected", "$events/client_disconnected" WHERE regex_match(clientid, '^dtu-[0-9]{15}$')"""
      actions = ["http:device_conn_events"]
    }
  }
}
