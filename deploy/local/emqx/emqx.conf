## 本地开发用 EMQX 配置，挂载为 /opt/emqx/etc/emqx.conf。生产配置另行维护，密钥不得沿用这里的值。
## 节点名、控制台密码等仍由 docker-compose.yml 中的环境变量覆盖。

node {
  name = "emqx@127.0.0.1"
  cookie = "emqx_cookie_dev_only"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 18083
}

## 一机一密（PRD 8.1）：每次连接回调业务服务校验，规则见 server/iot 的 EmqxAuthController。
## 业务服务未启动时回调失败，所有客户端都无法连接。
authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://host.docker.internal:8080/internal/emqx/authn"
    headers {
      "content-type" = "application/json"
      "x-emqx-token" = "emqx_hook_dev_only"
    }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    request_timeout = 5s
  }
]

## 主题权限：设备只能发布自己的上行、订阅自己的下行；云端账号为超级用户，不受限制。
authorization {
  no_match = deny
  deny_action = ignore
  cache {
    enable = true
  }
  sources = [
    {
      type = file
      enable = true
      path = "etc/acl.conf"
    }
  ]
}
