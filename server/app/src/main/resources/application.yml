spring:
  application:
    name: smartparking-server
  profiles:
    default: local
  flyway:
    # 迁移脚本只增不改；校验失败直接拒绝启动
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
