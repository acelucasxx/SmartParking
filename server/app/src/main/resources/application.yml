spring:
  application:
    name: smartparking-server
  servlet:
    multipart:
      # 设备批量导入（BIZ-03）：文件不超过 5 MB
      max-file-size: 5MB
      max-request-size: 6MB
  profiles:
    default: local
  flyway:
    # 迁移脚本只增不改；校验失败直接拒绝启动
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true

smartparking:
  mqtt:
    # 设备接入（PRD 8.1）。生产必须通过环境变量提供 url、password 与 auth 下的两项密钥
    enabled: true
    username: smartparking-server
    # 设备离线时 broker 最多暂存下行这么久，过期丢弃，不在设备上线后补执行（PRD 5.3④）
    downlink-expiry: 15s
    keep-alive: 30s
    reconnect-max-delay: 30s

  command:
    # 指令对账间隔（PRD 8.4⑤）
    reconcile-interval: 15s

  online:
    # 在线状态扫描间隔（PRD 8.5）：沉默导致的休眠 / 离线靠扫描发现
    sweep-interval: 60s

  status-sync:
    # 状态同步（PRD 8.7）：定时查询的检查间隔；查询周期本身取后台参数 status_poll.interval_minutes（默认 5 分钟）
    tick: 30s
    # 连接事件后延迟多久查询，等设备订阅好下行主题
    connect-delay: 2s

  user:
    # 小程序会话有效期（BIZ-01）；到期后前端重新 wx.login 静默登录。生产必须通过环境变量提供 data-key（手机号加密主密钥）
    session-ttl: 7d

  # 设备入库（BIZ-03）：生产必须提供 smartparking.device.activate-code-key（激活码哈希主密钥，DEVICE_ACTIVATE_KEY）
  # 与 smartparking.device.qr-url-template（机身二维码内容，EXT-13，DEVICE_QR_URL_TEMPLATE），缺少时拒绝启动

  wechat:
    # real 调用微信接口，需要 app-id 与 app-secret（EXT-10）；mock 只用于本地开发与测试
    mode: real
    base-url: https://api.weixin.qq.com
    connect-timeout: 3s
    read-timeout: 5s

  device-event:
    partitions:
      # 每天 03:10 与启动时维护 device_event 月度分区（PRD 9：保留 ≥ 180 天）
      enabled: true
      retention-days: 186
      months-ahead: 3

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
