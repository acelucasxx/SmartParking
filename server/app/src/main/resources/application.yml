spring:
  application:
    name: smartparking-server
  profiles:
    default: local
  flyway:
    # 迁移脚本只增不改；校验失败直接拒绝启动
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true

smartparking:
  mqtt:
    # 设备接入（PRD 8.1）。生产必须通过环境变量提供 url、password 与 auth 下的两项密钥
    enabled: true
    username: smartparking-server
    # 设备离线时 broker 最多暂存下行这么久，过期丢弃，不在设备上线后补执行（PRD 5.3④）
    downlink-expiry: 15s
    keep-alive: 30s
    reconnect-max-delay: 30s

  command:
    # 指令对账间隔（PRD 8.4⑤）
    reconcile-interval: 15s

  online:
    # 在线状态扫描间隔（PRD 8.5）：沉默导致的休眠 / 离线靠扫描发现
    sweep-interval: 60s

  status-sync:
    # 状态同步（PRD 8.7）：定时查询的检查间隔；查询周期本身取后台参数 status_poll.interval_minutes（默认 5 分钟）
    tick: 30s
    # 连接事件后延迟多久查询，等设备订阅好下行主题
    connect-delay: 2s

  device-event:
    partitions:
      # 每天 03:10 与启动时维护 device_event 月度分区（PRD 9：保留 ≥ 180 天）
      enabled: true
      retention-days: 186
      months-ahead: 3

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
