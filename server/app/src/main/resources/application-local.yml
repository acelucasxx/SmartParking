# 本地开发环境，与 deploy/local/docker-compose.yml 的默认值一致。
# 数据源自 INF-04 起生效（启动时自动执行 Flyway 迁移）；Redis 配置在引入 Redis 的任务中生效。
# 以下密码与密钥只用于本机开发，与 deploy/local/emqx 的配置、DTU 模拟器的默认值一致。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smartparking}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:smartparking}
    password: ${MYSQL_PASSWORD:smartparking_dev_only}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_dev_only}

smartparking:
  mqtt:
    url: tcp://${EMQX_HOST:localhost}:${EMQX_MQTT_PORT:1883}
    password: ${MQTT_SERVER_PASSWORD:mqtt_server_dev_only}
    auth:
      hook-token: ${EMQX_HOOK_TOKEN:emqx_hook_dev_only}
      device-secret-key: ${DEVICE_SECRET_KEY:device_secret_key_dev_only_0123456789}

logging:
  level:
    com.smartparking: DEBUG
